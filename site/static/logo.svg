<!-- Brand mark (also the SVG favicon). currentColor does NOT work here: loaded
     as an image the SVG has no embedding document, so it falls back to black.
     Hardcode the primary instead; keep it matching the app's primary color
     token (#712: pumpkin #fb923c for October — revert to gold #f2c14e after
     October). The clock wears a doodle witch hat for October; the viewBox
     shifts up 18 for headroom. -->
